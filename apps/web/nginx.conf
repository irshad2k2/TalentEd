server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Reverse proxy: in production the browser calls /api and /graphql on the SAME origin as the
  # site (build with VITE_API_URL empty). One port, no CORS, simple cookies.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s; # AI quiz generation can take a while
  }
  location /graphql {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Hashed asset files never change -> cache for a year
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page app: unknown paths serve index.html and React Router takes over
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}
