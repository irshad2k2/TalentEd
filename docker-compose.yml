# One command runs the whole platform:  docker compose up --build
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports: ['3306:3306']
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${MYSQL_ROOT_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    ports: ['27017:27017']
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible storage for local development.
  # MinIO stopped publishing free images (minio/minio and minio/mc are gone from Docker Hub),
  # so this uses Chainguard's free MinIO build. The API creates the bucket itself on startup.
  minio:
    image: cgr.dev/chainguard/minio:latest
    user: '0:0' # write access to the named volume (the image's default user is non-root)
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ['9000:9000', '9001:9001']
    volumes: [minio_data:/data]

  ai:
    build: ./apps/ai
    env_file: .env
    environment:
      MONGO_URL: mongodb://mongo:27017/talented
    ports: ['8000:8000']
    volumes: [hf_cache:/root/.cache]
    depends_on:
      mongo: { condition: service_healthy }

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      MONGO_URL: mongodb://mongo:27017/talented
      S3_ENDPOINT: http://minio:9000
      AI_SERVICE_URL: http://ai:8000
    ports: ['4000:4000']
    depends_on:
      mysql: { condition: service_healthy }
      mongo: { condition: service_healthy }
      minio: { condition: service_started }

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID}
    ports: ['5173:80']
    depends_on: [api]

volumes:
  mysql_data:
  mongo_data:
  minio_data:
  hf_cache:
