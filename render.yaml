# Render Blueprint: API + AI service on the free plan.
# Databases are external (TiDB Cloud / MongoDB Atlas) and storage is Supabase S3 - see docs/DEPLOYMENT.md.
services:
  - type: web
    name: talented-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: PUBLIC_URL # the Vercel URL, e.g. https://talented.vercel.app
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MONGO_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_PEPPER
        generateValue: true
      - key: INTERNAL_API_KEY
        sync: false # must match talented-ai
      - key: AI_SERVICE_URL
        sync: false # e.g. https://talented-ai.onrender.com
      - key: S3_BUCKET
        value: talented-videos
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  - type: web
    name: talented-ai
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/ai/Dockerfile
    dockerContext: ./apps/ai
    healthCheckPath: /health
    envVars:
      - key: MONGO_URL
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.1-8b-instant
      - key: LLM_API_KEY
        sync: false
